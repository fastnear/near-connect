name: Deploy Demo UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The three lockfiles are Yarn Berry (v10 metadata); the runner's default
      # `yarn` is classic 1.22, which cannot read them. corepack reads the
      # packageManager pin (yarn@4.17.1, same as .prototools) from package.json.
      - name: Enable Yarn 4 via corepack
        run: |
          npm install -g corepack@latest
          corepack enable
          yarn --version

      - name: Install deps (root, near-wallets, example)
        run: |
          yarn install --immutable
          (cd near-wallets && yarn install --immutable)
          (cd example && yarn install --immutable)

      - name: Build example
        run: |
          cd example
          yarn build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
